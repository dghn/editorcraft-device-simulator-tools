name: Publish release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify release version and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert tag == 'v' + json.loads(Path('package.json').read_text())['version']
          assert Path('.github/release-notes', tag + '.md').is_file()
          PY
      - name: Validate package
        run: python .github/scripts/validate_package.py
      - name: Test installer
        run: python -m unittest discover -s 'Tools~' -p 'test_*.py'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "EditorCraft Device Simulator Tools $RELEASE_TAG" --notes-file ".github/release-notes/$RELEASE_TAG.md" --latest
