name: Publish report previews
on:
  push:
    branches: [main]
    paths:
      - 'Documentation~/assets/demos/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage public report previews
        run: |
          mkdir -p _site
          cp -R 'Documentation~/assets/demos/puzzle-audit' _site/
          cp -R 'Documentation~/assets/demos/favorite-gallery' _site/
          cp 'Documentation~/assets/demos/previews.html' _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy reports
        id: deployment
        uses: actions/deploy-pages@v4
